<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRMA Editor</title>
    <script>
      // Apply the persisted theme before first paint (mirrors loadUI() in store.ts).
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem('vrma-editor-ui') || '{}').theme === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
